<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Felix Gnass</title>
    <meta
      name="description"
      content="Felix Gnass — software developer in Hamburg, Germany. Weekend projects and small, self-contained web experiments."
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="canonical" href="https://gnass.buzz/" />

    <!-- Open Graph / social preview. Static image (public/og.png, 2400×1260)
     mirrors the home page in palette 5. theme-color is set per-palette at
     runtime by roll.js/buzz.js, so it is intentionally not declared here. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="gnass.buzz" />
    <meta property="og:url" content="https://gnass.buzz/" />
    <meta property="og:title" content="Felix Gnass" />
    <meta
      property="og:description"
      content="Software developer in Hamburg, Germany. Weekend projects and small, self-contained web experiments."
    />
    <meta property="og:image" content="https://gnass.buzz/og.png" />
    <meta property="og:image:width" content="2400" />
    <meta property="og:image:height" content="1260" />
    <meta property="og:image:alt" content="Felix Gnass — gnass.buzz" />
    <meta property="og:locale" content="en_US" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Felix Gnass" />
    <meta
      name="twitter:description"
      content="Software developer in Hamburg, Germany. Weekend projects and small, self-contained web experiments."
    />
    <meta name="twitter:image" content="https://gnass.buzz/og.png" />
    <!-- Page styles + shared palette colours (keyed by data-pal/data-inv on <html>).
     The SPA router reconciles these stylesheets on navigation; the shared
     palette.css matches across pages and stays put. -->
    <link rel="stylesheet" href="/home.css" />
    <link rel="stylesheet" href="/palette.css" />
    <!-- Pre-paint palette pick (blocking, classic): sets data-pal on <html> before
     first paint so the page paints in its final palette.css colours — no flash. -->
    <script src="/roll.js"></script>
    <!-- buzz engine, sounds, palette re-roll, SPA router + page logic (bundled). -->
    <script type="module" src="/buzz.js"></script>
  </head>
  <body>
    <p class="kicker">gnass.buzz</p>

    <main>
      <div class="name" id="hero">
        <span class="line">Felix</span>
        <span class="line">Gnass</span>
      </div>

      <div class="info">
        <div class="actions">
          <div class="meta">
            <span>Software Developer</span>
            <span>Hamburg, Germany</span>
          </div>
          <span class="cta">
            <a class="buzz-btn" id="buzz" href="/projects">Weekend Projects</a>
            <span class="cta-hint"><span class="arrow">←</span>&nbsp;bzzzt</span>
          </span>
        </div>
        <nav>
          <a href="https://github.com/fgnass" rel="me">GitHub</a>
          <a href="https://www.linkedin.com/in/fgnass/" rel="me">LinkedIn</a>
          <a href="https://indieweb.social/@fgnass" rel="me">Mastodon</a>
          <a href="https://bsky.app/profile/gnass.buzz" rel="me">Bluesky</a>
          <a id="email" href="#">E-Mail</a>
        </nav>
      </div>
    </main>
  </body>
</html>
